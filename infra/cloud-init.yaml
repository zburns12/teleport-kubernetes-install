#cloud-config
# Node preparation shared by all three nodes (master, worker-1, worker-2).
# Turns the Kubernetes "Container Runtimes" and "Installing kubeadm" pages
# into a single file so every node is prepared identically.
#
# Usage:
#   multipass launch 24.04 --name master --cpus 2 --memory 4G --disk 20G --cloud-init infra/cloud-init.yaml
#
# Versions are pinned. Update the v1.36 repo path and the package version together.

package_update: true
package_upgrade: false

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - containerd

write_files:
  # Kernel modules required by containerd and the CNI
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  # Required sysctls (kubeadm preflight fails without ip_forward=1)
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1

runcmd:
  # --- kernel / sysctl ---
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # --- swap (Multipass images normally ship without swap; this is defensive) ---
  - swapoff -a
  - sed -i '/\sswap\s/ s/^/#/' /etc/fstab

  # --- containerd: generate full default config and use the systemd cgroup driver ---
  # The Ubuntu package installs containerd with no /etc/containerd/config.toml,
  # which means the cgroupfs driver. kubelet defaults to systemd; they must match.
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # --- kubeadm / kubelet / kubectl from pkgs.k8s.io, pinned ---
  - mkdir -p -m 755 /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet=1.36.4-1.1 kubeadm=1.36.4-1.1 kubectl=1.36.4-1.1
  - apt-mark hold kubelet kubeadm kubectl
  - systemctl enable kubelet

final_message: "Node prep complete after $UPTIME seconds"

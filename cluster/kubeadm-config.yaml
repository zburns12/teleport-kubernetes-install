# kubeadm init configuration for the single control-plane node.
# Run on master:  sudo kubeadm init --config kubeadm-config.yaml
#
# Why a config file instead of flags: it lives in the repo and a reviewer can read
# exactly how the cluster was built. Both settings below are init-time only and
# cannot be added after the fact.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.36.4
# Hostname, not IP: Multipass VM IPs can change across restarts. Resolved via /etc/hosts.
controlPlaneEndpoint: "master:6443"
networking:
  # Must not overlap the VM subnet (192.168.64.0/24) or the service CIDR (10.96.0.0/12 default).
  podSubnet: 10.244.0.0/16
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Explicit for clarity; this is kubeadm's default and matches containerd's SystemdCgroup=true.
cgroupDriver: systemd
